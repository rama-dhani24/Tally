name: tally
description: A calm personal debt tracker for East Africa.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  shared_preferences: ^2.5.3
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assetsfonts/Poppins-Regular.ttf
          weight: 400
        - asset: assetsfonts/Poppins-Medium.ttf
          weight: 500
        - asset: assetsfonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assetsfonts/Poppins-Bold.ttf
          weight: 700
